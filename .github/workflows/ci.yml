name: CI

# Roadmap Phase 1 (A2a): the test suites become required checks — this workflow
# is the gate. Branch protection (making these jobs *required*) is a repo
# setting flipped by the owner; the jobs themselves need no secrets: conftest
# isolates the DB in a tempdir and blanks ANTHROPIC_API_KEY.

on:
  push:
    branches: [dev, Prod]
  pull_request:
    branches: [dev, Prod]

# MED-013: least privilege — the default GITHUB_TOKEN is repo-wide write unless
# scoped here. CI only reads the code, so grant read-only.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Phase 2: the suite runs on Postgres. conftest drops/recreates the test
    # database named in ARCEO_TEST_DATABASE_URL on this service container and
    # migrates it via Alembic before any app import.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arceo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      # Phase 3: shared state (rate limits, live-trace pub/sub, leader lock,
      # notification dedup) runs on Redis. Tests use DB 15 (flushed per test).
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      ARCEO_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arceo_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871  # v4.2.1
      - name: Set up Python 3.11
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        # Hash-pinned install (MED-012): reproducible + integrity-verified.
        run: pip install --require-hashes -r requirements-dev.lock
      - name: Run tests
        run: python -m pytest tests/ -q
      # Vendor prices drift; each model row carries verified_on + source_url.
      # Warn-only (::warning:: annotations) so the passage of time never fails
      # an unrelated PR — run with --strict in a scheduled audit if wanted.
      - name: Price-table freshness (warn-only)
        run: python ../scripts/check_price_freshness.py
      # Rehearse the SQLite→Postgres data-copy path the prod cutover will use:
      # seed a small legacy SQLite file, copy it into a fresh Postgres database,
      # and verify per-table row counts. Guards the runbook, not the app.
      - name: Rehearse SQLite→Postgres migration script
        run: python ../scripts/migrate_sqlite_to_pg.py --rehearse
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arceo_migration_rehearsal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871  # v4.2.1
      - name: Set up Node 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # Advisory dependency-vulnerability scan (the report noted no such step existed).
  # Non-blocking for now: pip-audit (backend lock) + npm audit (frontend lock)
  # surface CVEs as annotations without failing unrelated PRs. Flip the
  # continue-on-error flags off to make it a hard gate once the tree is clean.
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871  # v4.2.1
      - name: Set up Python 3.11
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
        with:
          python-version: '3.11'
      - name: pip-audit (backend deps)
        continue-on-error: true
        working-directory: backend
        run: |
          # Version-pinned for the same reason MED-018 pinned the customer action:
          # an unpinned install runs whatever the index serves at that moment. This
          # one is Arceo's own CI rather than a customer's, so the blast radius is
          # smaller — but it sits directly above a --require-hashes install, and the
          # inconsistency was the gap, not the risk level.
          # Pinned to the current release (verified on PyPI 2026-07-30), not an
          # older "safe" one: this tool's job is knowing about recent CVEs, so the
          # pin should be refreshed forward, never left to rot.
          pip install pip-audit==2.10.1
          pip-audit -r requirements.lock
      - name: Set up Node 22
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: '22'
      - name: npm audit (frontend deps)
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high
