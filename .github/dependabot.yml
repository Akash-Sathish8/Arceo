version: 2
# Dependabot version updates are PAUSED. `open-pull-requests-limit: 0` stops it
# from automatically opening dependency PRs (they were creating branch/PR noise).
# The config is kept (not deleted) so it's easy to re-enable: raise the limit
# (e.g. back to 2) with grouped + monthly updates on whichever ecosystems you
# want. Note: this only governs version-update PRs; Dependabot security
# alerts/updates are a separate repo setting.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
