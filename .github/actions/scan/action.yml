name: 'Arceo Agent Security Scan'
description: 'Scan AI agent code for blast radius and dangerous risk-label chains'
author: 'Arceo'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  api-key:
    description: 'Arceo API key (X-API-Key). Get one from your Arceo dashboard.'
    required: true
  api-url:
    description: 'Arceo backend base URL'
    required: false
    # No default: api.arceo.dev has never had a DNS record. Point this at your
    # own instance.
    default: ''
  threshold:
    description: 'Fail build if max blast radius exceeds this (0-100)'
    required: false
    default: '60'
  comment-mode:
    description: 'pr-comment | none — whether to post the report as a PR comment'
    required: false
    default: 'pr-comment'
  paths:
    description: 'Comma-separated file extensions to scan'
    required: false
    default: '.py,.ts,.tsx,.js,.jsx,.mjs'
  max-files:
    description: 'Maximum files to scan per run (cost guardrail)'
    required: false
    default: '25'
  github-token:
    description: 'GitHub token for posting PR comments. Defaults to github.token.'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3  # v5.2.0
      with:
        python-version: '3.11'

    # MED-018: there is deliberately no dependency-install step. run.py uses only
    # the standard library, so nothing is fetched from PyPI inside the customer's
    # CI — where their ARCEO_API_KEY and a GITHUB_TOKEN are both in scope. The
    # previous `pip install --quiet httpx` was unpinned and unhashed, i.e. it ran
    # whatever the index served at that moment, in someone else's pipeline.
    - name: Run Arceo scan
      shell: bash
      env:
        ARCEO_API_KEY: ${{ inputs.api-key }}
        ARCEO_API_URL: ${{ inputs.api-url }}
        ARCEO_THRESHOLD: ${{ inputs.threshold }}
        ARCEO_COMMENT_MODE: ${{ inputs.comment-mode }}
        ARCEO_PATHS: ${{ inputs.paths }}
        ARCEO_MAX_FILES: ${{ inputs.max-files }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python ${{ github.action_path }}/run.py
