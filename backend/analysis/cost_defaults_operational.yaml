# ──────────────────────────────────────────────────────────────────────────
# 2. Per-action tool API costs (USD per action call)
# Skip tools that are effectively free at agent volumes.
# Tool names match what extractor / parser produces.
# ──────────────────────────────────────────────────────────────────────────
tool_action_costs:
  sendgrid:
    send_email: 0.0004
    send_template_email: 0.0004
    create_campaign: 0.0010
  twilio:
    send_sms: 0.0079
    make_call: 0.014
  stripe:
    create_refund: 0.0
    create_payout: 0.25
    create_transfer: 0.25
    create_charge: 0.029
    void_invoice: 0.0
  aws_lambda:
    invocation: 0.0000002
  aws_s3:
    put_object: 0.000005
    get_object: 0.0000004
  aws_rds:
    create_snapshot: 0.020
    delete_snapshot: 0.0
  pinecone:
    query: 0.00000825
    upsert: 0.000002
  openai_embeddings:
    embed: 0.00000013
  browserbase:
    create_session: 0.0017

# ──────────────────────────────────────────────────────────────────────────
# 3. Default token usage per LLM turn (no calibration data)
# ──────────────────────────────────────────────────────────────────────────
turn_defaults:
  system_prompt_tokens: 800       # typical Arceo-style system prompt
  tool_overhead_per_tool: 400     # MCP tool definitions ~400 tok each
  user_message_tokens: 120        # avg user input
  tool_result_tokens: 500         # avg result returned to model
  completion_tokens: 300          # avg model response
  history_growth_per_turn: 1500   # conversation context accumulated per extra turn
                                  # (averaged across the run in the static estimate)

# ──────────────────────────────────────────────────────────────────────────
# 4. Scenario shape defaults
# Used when no sandbox traces or live traces exist.
# Calibrates further once data flows in.
# ──────────────────────────────────────────────────────────────────────────
scenario_defaults:
  default_calls_per_day: 100      # conservative — UX should ask user (= RUNS/day)
  avg_turns_per_run: 4            # fallback LLM round-trips per run (see archetype map below)
  default_runtime_seconds: 4.2
  default_cache_hit_rate: 0.60    # 60% — common with Anthropic auto-caching
  default_retry_rate: 0.03        # 3%

# Cold-start turns/run by inferred archetype — a scheduler isn't a devops loop.
# Refined automatically once a sandbox sweep / live traces measure real turns;
# the CFO can also override via the "Turns per run" slider or expected_turns_per_run.
default_turns_per_run_by_archetype:
  scheduler: 2
  support: 4
  sales: 4
  devops: 8
  ops: 8
  default: 4

# ──────────────────────────────────────────────────────────────────────────
# 5. Confidence bands (multiplier on point estimate)
# Wider for low-confidence tier; tighter for high.
# Source: brain/Signals/Cost forecaster calibration data.md
# ──────────────────────────────────────────────────────────────────────────
confidence_bands:
  low:                              # static — capability tree only
    # Asymmetric on purpose (calibrated 2026-07-03 vs the hand-truth fleet in
    # test-agents/synthetic): with declared volume never inflated, residual
    # capability-only error skews UNDER (skewed tool mix, loop history, context
    # beyond the declared bucket ran truth up to 3.1x point). A symmetric 1.8x
    # ceiling covered truth for only 4/8 agents; [0.5, 3.0] covers 8/8.
    low_multiplier: 0.50
    high_multiplier: 3.00
  medium:                           # sandbox simulation traces available
    # Asymmetric (calibrated 2026-07-03 vs the hand-truth fleet): a sandbox
    # measures loop BEHAVIOR (turns, completion sizes, action ordering) but
    # structurally cannot observe production data volumes or tool-mix skew —
    # those residuals all skew UNDER. The old symmetric ±28% band held only
    # 3/8 truths; [0.7, 2.0] holds the behavior-driven majority while the
    # UI caption says plainly what a sweep can and can't measure. Precision
    # is the LIVE tier's job.
    low_multiplier: 0.70
    high_multiplier: 2.00
  high:                             # live production traces ≥7 days
    low_multiplier: 0.85
    high_multiplier: 1.15

# ──────────────────────────────────────────────────────────────────────────
# 6. Per-call infrastructure overhead (compute, mocks, observability)
# Split: a fixed overhead + a runtime-proportional compute cost. The compute
# rate (~2 vCPU serverless, ~$0.65/hr ≈ $0.00018/s) makes runtime a real cost
# lever. At the 4.2s default runtime this nets ~$0.00096/call (≈ the prior flat
# $0.001), so existing forecasts barely move.
# ──────────────────────────────────────────────────────────────────────────
infrastructure:
  per_call_overhead_usd: 0.0002
  compute_cost_per_second_usd: 0.00018

# ──────────────────────────────────────────────────────────────────────────
# 7. Sensitivity ranking (which inputs affect cost most)
# These are roughly constant across agents — see methodology signal.
# ──────────────────────────────────────────────────────────────────────────
sensitivity_ranking:
  - label: "Calls per day"
    pct: 76
    color: "linear-gradient(90deg, #fecaca, #ef4444)"
  - label: "Model choice"
    pct: 42
    color: "linear-gradient(90deg, #fde68a, #f59e0b)"
  - label: "Cache hit rate"
    pct: 23
    color: "linear-gradient(90deg, #fde68a, #f59e0b)"
  - label: "Runtime / call"
    pct: 18
    color: "linear-gradient(90deg, #d1d5db, #9ca3af)"
  - label: "Retry rate"
    pct: 10
    color: "linear-gradient(90deg, #d1d5db, #9ca3af)"
