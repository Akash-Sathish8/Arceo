# Operational cost defaults for Arceo's spend forecaster.
# Distinct from cost_defaults.yaml (which models cost-of-breach).
# Every model row carries source_url + verified_on; scripts/check_price_freshness.py
# warns in CI when a row goes >90 days unverified (--strict to hard-fail).
# After ANY edit to this file, rerun scripts/gen_cost_defaults_fallback.py —
# tests/test_price_hygiene.py fails if the generated fallback JSON drifts.
# Calibration history lives in brain/Signals/Cost forecaster calibration data.md;
# the authoritative date is the `last_calibrated` field below (keep them in sync).

# Surfaced in forecast responses so the UI can show an accurate
# "last calibrated" date instead of a hardcoded string. Update when the
# YAML body is materially recalibrated.
last_calibrated: "2026-08-09"

# ──────────────────────────────────────────────────────────────────────────
# 1. LLM model pricing (USD per million tokens)
# ──────────────────────────────────────────────────────────────────────────
# Anthropic prices verified against the live model catalog on 2026-07-03
# (opus-4-8 $5/$25, sonnet-4-6 $3/$15, haiku-4-5 $1/$5) — do not "fix" the
# Opus ratio to the historical 5x-of-Sonnet; the 4.8 repricing is real.
# Re-verified 2026-08-09 against every vendor's own pricing page: all eight
# Anthropic rows were correct; seven non-Anthropic rows were not (see their
# inline notes) and six missing models were added.
#
# ── OPTIONAL: `effective_price` — a rate that varies over TIME ──────────────
# A row's input_per_mtok/output_per_mtok are the STICKER rate. A row may also
# carry a dated promotional rate:
#
#   effective_price:
#     input_per_mtok: 2.00
#     output_per_mtok: 10.00
#     until: "2026-08-31"     # INCLUSIVE — last day the rate applies
#
# The two are used for different questions and must not be conflated:
#   · FORECASTS price at sticker — they are about money not yet spent, and a
#     promo that expires must not be projected into next month.
#   · OBSERVED calls ("what did we actually spend") reprice at effective_price
#     when the call's own date falls on or before `until`.
# See _effective_rates() in analysis/spend_forecast.py. An org's NEGOTIATED rate
# always wins over a public promo — load_defaults() drops this block for any
# model that org has overridden.
#
# ⚠️ KNOWN MODELLING GAP — flat rates, no context-length tiers.
# Several vendors price by prompt length and we carry only the low tier:
#   gemini-2-5-pro          $1.25/$10.00  ≤200k  →  $2.50/$15.00  >200k
#   gemini-3-1-pro-preview  $2.00/$12.00  ≤200k  →  $4.00/$18.00  >200k
#   grok-4-5 / grok-4-3 / grok-build-0-1   tiered by prompt length, ~2x at the top
# Long-context agents on those models are therefore UNDER-forecast by up to 2x.
# `effective_price` is the TIME half of Tier 1.5's "rate that varies along a
# dimension"; the length half wants the same shape keyed on tokens, not a date,
# and can land on this schema without reworking it.
models:
  # Added 2026-08-09: Opus 5 is the current Opus and was absent entirely, so an
  # agent declaring it fell through to family-matching.
  claude-opus-5:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    cache_discount: 0.90
    # Same static-tier assumption as opus-4-8 — see the note on that row.
    tokenizer_inflation: 1.35
    source_url: https://platform.claude.com/docs/en/pricing
    verified_on: "2026-08-09"
  claude-opus-4-8:
    input_per_mtok: 5.00
    output_per_mtok: 25.00
    cache_discount: 0.90        # cached input = 10% of input price
    # UNVERIFIED assumption, applied ONLY to the static char-based token estimate
    # (never to observed/declared tokens, which already reflect the tokenizer).
    # It only nudges the low/static tier, whose band ([0.5, 3.0]) already absorbs
    # tokenizer variance. Adjustable; drop to 1.0 if a measurement disagrees.
    tokenizer_inflation: 1.35
    source_url: https://platform.claude.com/docs/en/pricing
    verified_on: "2026-07-12"
  claude-sonnet-4-6:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    cache_discount: 0.90
    tokenizer_inflation: 1.0
    source_url: https://platform.claude.com/docs/en/pricing
    verified_on: "2026-07-12"
  claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
    cache_discount: 0.90
    tokenizer_inflation: 1.0
    source_url: https://platform.claude.com/docs/en/pricing
    verified_on: "2026-07-12"
  # Rows below verified against the live Anthropic model catalog on 2026-07-12.
  # Before these existed, ids like claude-fable-5 silently family-matched to
  # claude-opus-4-8 and billed at HALF the real rate.
  claude-fable-5:
    input_per_mtok: 10.00
    output_per_mtok: 50.00
    cache_discount: 0.90
    # Same tokenizer as opus-4-8, so it inherits the same (unverified,
    # static-tier-only) inflation assumption.
    tokenizer_inflation: 1.35
    source_url: https://platform.claude.com/docs/en/pricing
    verified_on: "2026-07-12"
  claude-sonnet-5:
    # STICKER price — what a forecast must project, because a forecast is about
    # money not yet spent and the promo below expires. Anthropic's INTRO rate of
    # $2/$10 runs through 2026-08-31; `effective_price` carries it so OBSERVED
    # calls are repriced at what was actually billed. Pricing at sticker on both
    # sides overstated money already spent by 50% ($3 charged where $2 was billed
    # — equivalently, the real bill lands 33% below sticker).
    input_per_mtok: 3.00
    output_per_mtok: 15.00
    effective_price:
      input_per_mtok: 2.00
      output_per_mtok: 10.00
      # INCLUSIVE — the last day the promo applies. A call on 2026-08-31 bills at
      # $2/$10; one on 2026-09-01 bills at sticker.
      until: "2026-08-31"
      source_url: https://platform.claude.com/docs/en/pricing
      verified_on: "2026-08-26"
    cache_discount: 0.90
    # Sonnet 5 moved to the opus-4-7/4-8 tokenizer (~30% more tokens than 4.6
    # for the same text) — same unverified static-tier inflation as opus.
    tokenizer_inflation: 1.35
