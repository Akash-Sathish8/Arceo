  - teenager
  - parent
  - boss
  - manager
  - executive
  - investor
  - expert
  - plain words
  # tone
  - tone
  - friendly
  - formal
  - casual
  - polite
  # one more thing to hand over
  - version
  - options
  - examples
  - tip
  - recommendation
  - recommend
  - extra
  - bonus
  - additional
  - include
  - add
  - attach
  - cite
  - quote
  - question
  - reminder
  - checklist
  # timing and language
  - deadline
  - minute
  - hour
  - day
  - week
  - weekly
  - daily
  - month
  - language

# Pairs of groups that point opposite ways. Two prompts whose openings are about opposite ones
# ("ask happy customers for a review" / "win back unhappy customers") do different jobs, however
# much else they share; neither may mention both.
opposites:
  - [happy, angry]

