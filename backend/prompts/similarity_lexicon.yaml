# Words that make a clause a REQUIREMENT on the output: its format, length, audience, tone,
# timing, or one more thing to hand over. A clause one prompt has and the other doesn't
# ("..., and keep it under 100 words", "also give me a version for kids") makes the two
# variants ("close"), not the same prompt. Groups with a `shape` or a `role`, and numbers,
# count as well. Matched like everything else (stemmed, lexicon phrases first).
requirement_words:
  # format and structure
  - format
  - layout
  - column
  - row
  - section
  - paragraph
  - sentence
  - line
  - word
