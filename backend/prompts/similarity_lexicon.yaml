# Prompt-match lexicon (plan section 1, Stage 1). Data, not code.
#
# Each group lists words and phrases people use for the SAME thing when they
# write a prompt. Matching runs on stemmed words, longest phrase first, so
# "bullet points" wins over "bullet" and plurals/verb forms come for free.
# `label` is the plain-language name shown to people ("Both: summarize ·
# email · bullets"), so it must read naturally to someone who doesn't code.
# `shape` marks output formats the shape channel tracks ("3 bullets" vs "5").
#
# Rules for growing this file:
#   - only genuine, general synonyms or plain rewordings of one idea;
#   - never a phrase that exists only to make one eval case pass;
#   - a term may appear in exactly one group (loading fails otherwise).
#
# `spelling` folds British spellings into American before stemming.
# `stem_overrides` keeps words apart that the stemmer would merge
# ("customers" and "custom" both stem to "custom").
# `stop_phrases` are filler removed before matching.

stem_overrides:
  # a promotion at work isn't marketing; one sales "lead" isn't "lead with", "account lead" or "team lead"
