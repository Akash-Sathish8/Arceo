# ---------------------------------------------------------------- 184
- id: q4-roles-para
  target: Roles for admins and members
  kind: paraphrase
  expect: same
  query:
    title: Permission levels
    body: |-
      My app needs different levels of access: {{levels}}. Make sure the rules are checked on the server where the data lives, not just by hiding things on screen, so nobody can sneak in by typing a web address. Everyone who signs up should begin as {{starting_level}}, and only admins can promote or demote people. Before writing anything, give me a simple grid of which level can do what and wait for my go-ahead. When it's finished, tell me how to test it logged in as each type of user.

- id: q4-roles-ext
  target: Roles for admins and members
  kind: extended
  expect: close
  yours_only: [log of every level change, pause someone's access without deleting them]
  query:
    body: |-
      Add roles to my app: {{roles_and_powers}}. Enforce these rules where the information is kept, not just by hiding buttons, so nobody can get around them by guessing an address. New sign-ups start as {{default_level}}, and only an admin can change someone's level. Keep a simple log of every level change (who changed it and when), and let admins pause someone's access without deleting their account. Before you build, show me a simple table of who can do what and wait for my OK. Afterwards, give me steps to test as each kind of person.

- id: q4-roles-trim
  target: Roles for admins and members
  kind: trimmed
  expect: close
  theirs_only: [enforce rules where the data is kept, not just by hiding buttons]
  query:
    title: Admin and member roles
    body: |-
      Add roles to my app: {{roles}}. New people start as {{default_role}} and only an admin can change someone's role. Show me a quick table of who can do what and wait for my OK before building, then give me steps to test as each kind of user.

