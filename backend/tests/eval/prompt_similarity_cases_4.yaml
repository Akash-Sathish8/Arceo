- id: q4-loading-para-filled
  target: Show progress while things load
  kind: paraphrase
  expect: same
  filled: true
  query:
    title: Loading states
    body: |-
      Some screens in my app look broken while they load. The booking list is just empty for a couple of seconds and then everything pops in and shoves the page down, and people double-tap the Confirm button because nothing seems to happen. Add grey placeholder blocks where things will appear, a little spinner on buttons while they work (and block a second tap), and stop everything jumping when the content arrives. If it's taking more than a few seconds, show a calm message. Only change what people see during the wait, not how data is fetched. Also tell me how to fake a slow connection on my laptop to test it.

