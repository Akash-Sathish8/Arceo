- id: q4-review-reply-para-filled
  target: Reply to an online review
  kind: paraphrase
  expect: same
  filled: true
  query:
    title: Respond to 1-star Google review
    body: |-
      Help me answer this Google review for Harbor Lane Physio. It's 1 star. Keep in mind people thinking about booking with us will read our reply more than the reviewer will. Thank them, refer to something specific they mentioned, and stay under 80 words. Say sorry for how it felt without getting defensive or making excuses, and don't mention anything about their treatment or visit. Ask them to get in touch through the front desk email so we can make it right.

      "Booked online, showed up, and they had no record of my appointment. Had to rebook for next week. Waste of a morning."

- id: q4-review-reply-hn-write-supplier-review
