- id: q4-release-notes-para-filled
  target: Release notes
  kind: paraphrase
  expect: same
  filled: true
  query:
    title: What's new post
    body: |-
      Can you rewrite our changelog for customers? Group it under New, Improved and Fixed and open each item with what's better for them, not the technical detail.

      - Added CSV export on the invoices screen
      - Reports page now loads about 3x faster
      - Fixed a bug where recurring events skipped February 29
      - Added dark mode to the mobile app

- id: q4-release-notes-hn-team-brief
  target: Release notes
  kind: hard_negative
  expect: none
  query:
    title: Brief the support team on the release
    body: |-
      Here are the changes going out in Thursday's release: {{changes}}. Write an internal briefing for our sales and support team, not for customers. For each change, explain in one line what it means for customers, the questions customers are likely to ask about it, and a suggested answer for each. Flag anything that could cause confusion or complaints on day one.

# ---------------------------------------------------------------- 180
- id: q4-comment-replies-para-filled
  target: Replies to comments on my post
  kind: paraphrase
  expect: same
  filled: true
  query:
    body: |-
      We posted on Facebook about our new weekend brunch menu and people have been commenting. Write a quick reply to each comment as Little Fig Cafe - friendly, sounding like a real person, 30 words max. Say thanks to the nice ones, give straight answers to questions, and if someone's unhappy, invite them to DM us rather than hashing it out publicly. Anything that's spam or nasty, just mark it Skip. I'll read them over before anything gets posted.

      Comments:
      1. The lemon ricotta pancakes were unreal 😍
      2. Are you doing gluten free options?
      3. Waited 45 min for eggs on Sunday, not impressed
      4. Check my page for cheap followers!!!
      5. What time does brunch end?

- id: q4-comment-replies-ext
  target: Replies to comments on my post
  kind: extended
  expect: close
  yours_only: [mark unanswerable questions instead of guessing, one-line summary of what people are saying]
  query:
    title: Reply to my post comments
    body: |-
      Below are comments people left on our {{platform}} post about {{post_topic}}. Draft a short, friendly reply to each one in the voice of {{business_name}}: warm, human and under 30 words. Thank the kind ones, answer questions plainly, and for complaints offer to sort it out in a private message. If a comment is spam or abusive, label it "Skip" instead of replying. If someone asks something you can't answer from what I've given you, write "[need info]" rather than guessing. At the top, give me a one-line summary of what people are mostly saying. These are drafts for me to check before anything goes up.
      <comments>{{comments}}</comments>

- id: q4-comment-replies-trim
  target: Replies to comments on my post
  kind: trimmed
  expect: close
  theirs_only: [label spam or abusive comments Skip]
  query:
    body: |-
      Here are the comments on our {{platform}} post about {{topic}}. Write a short, warm reply to each one as {{brand}}, under 30 words and sounding human. Thank people who were nice, answer any questions plainly, and if someone's complaining, suggest we continue in a private message instead of going back and forth in public. These are drafts I'll check before posting.
      Comments: {{comments}}

