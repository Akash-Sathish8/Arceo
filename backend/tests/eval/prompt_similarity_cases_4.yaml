# Prompt-match eval cases, quarter 4 of the seed corpus.
#
# Corpus: every prompt in backend/prompts/seed/*.yaml, sorted by title
# (case-insensitive). At the time of writing there were 237 prompts, so
# quarter 4 = sorted indices 177..236 ("Quick overview of an industry" ..
# "Write a guide to my project for next time"), 60 prompts.
#
# Per prompt (local position p = 0..59 within the quarter):
#   - every prompt: 1 paraphrase (expect: same); about 1 in 4 is pasted with
#     real content instead of blanks (marked filled: true)
#   - odd p:        1 extended   (expect: close), yours_only = what was added
#   - p % 4 == 3:   1 trimmed    (expect: close), theirs_only = what was dropped
#   - even p:       1 hard_negative (expect: none for that target); each was
#     checked against every corpus title/description so no other prompt does
#     that job
# Plus 10 novel cases (target: null, expect: none).
#
# Written without looking at the matcher's code, lexicon or weights.
cases:

# ---------------------------------------------------------------- 177
- id: q4-industry-overview-para
  target: Quick overview of an industry
  kind: paraphrase
  expect: same
  query:
    title: Industry crash course
    body: |-
      I'm thinking about getting into {{market}} and know almost nothing about it, especially when it comes to {{angle}}. Walk me through the basics: how companies there actually earn their money, what kinds of players exist with a few examples, what buyers care about most, and 3 shifts happening right now. Max 400 words. Your info might be stale, so point out any numbers I should double-check and tell me what to verify with up-to-date sources.

- id: q4-industry-overview-hn-market-size
  target: Quick overview of an industry
  kind: hard_negative
  expect: none
  query:
    title: Market size estimate
    body: |-
      Give me a rough estimate of how big the market is for {{industry}} in {{region}}. Work it out bottom-up: how many potential customers there are, how often they buy, and what they spend each time, and show every assumption on its own line so I can change it. Give a low, middle and high figure. Some numbers may be out of date, so tell me which ones to confirm with current sources.

# ---------------------------------------------------------------- 178
- id: q4-quiz-para
  target: Quiz that recommends a product
  kind: paraphrase
  expect: same
  query:
    body: |-
      I want a little "which one is right for you?" quiz on my site for our {{product_line}}. Questions, one per screen with large buttons that are easy to tap on a phone: {{questions}}. Here's how answers map to a result: {{logic}}. At the end show the recommended option, a one-line reason, and a button so they can {{cta}}. Let people go back a question or restart. Walk me through how you'll apply my mapping before you build so I can check it, and when it's done tell me how to try the quiz.

- id: q4-quiz-ext
  target: Quiz that recommends a product
  kind: extended
  expect: close
  yours_only: [optional email before the result, count of people per result]
  query:
    title: Product finder quiz with email capture
    body: |-
      Build a short quiz that helps visitors find the right {{what_it_recommends}}. Ask these, one per screen with big, easy-to-tap answers: {{what_to_ask}}. Pick the result using these rules: {{matching_rules}}. The result screen shows the pick, one sentence on why, and a button to {{result_action}}. People can go back a step or start over. Just before the result, ask for an optional email address so we can send them their recommendation, and keep a running count of how many people land on each result so I can see which is most popular. Before building, explain how you'll turn my rules into results so I can confirm it's right, then afterwards tell me how to take the quiz myself.

