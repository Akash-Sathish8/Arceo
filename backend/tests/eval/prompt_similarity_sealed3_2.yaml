# Sealed held-out set, round 3, half 2 (written without looking at the
# matcher, its lexicon/weights, or any other eval file).
# Corpus = every prompt in prompts/seed/*.yaml sorted by title (case-insensitive);
# this file covers the second half (index n//2 onward), every 3rd prompt
# starting at offset 2, one case each, kinds rotating
# paraphrase -> extended -> trimmed -> hard_negative. Plus 8 novel jobs.
#   paraphrase    expect same   (same job, different words; ~1 in 3 pastes real content)
#   extended      expect close  (1-2 genuinely new requirements)
#   trimmed       expect close  (one important requirement / output element dropped)
#   hard_negative expect none   for that target (same category, overlapping words,
#                               different job that no corpus prompt does)
#   novel         target null, expect none (no corpus prompt does it)
cases:

# ── 0 paraphrase ───────────────────────────────────────────────────────────
- id: y2-phone-pass-every-page
