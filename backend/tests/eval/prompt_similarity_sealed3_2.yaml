    title: site on phones
    body: |
      pretty much everyone visits my candle shop site on their phone and honestly its kind of painful. can you go thru all the pages like you're holding a small phone and fix it - words are too tiny without zooming, buttons + links are hard to hit with your thumb, things that sit side by side should stack, and it scrolls left/right which drives me nuts. also when you type a phone number it should pop up the number pad and the email box should get the email keyboard. dont mess with how it looks on a computer. give me a list per page of what you changed and tell me how i can see the phone size view on my laptop

