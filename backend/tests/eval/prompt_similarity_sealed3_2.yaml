# ── 27 hard_negative ───────────────────────────────────────────────────────
- id: y2-hn-posts-into-one-article
  target: Repurpose an article into posts
  kind: hard_negative
  expect: none
  query:
    body: |
      i wrote 6 linkedin posts about hiring for small teams over the past month (pasted below). stitch them together into ONE proper article for our company blog, around 800 words, with a real beginning, middle and end so it doesn't read like 6 posts glued together. don't repeat the same points twice.

      1) Stop writing job posts like wish lists. Nobody has 12 "must-haves".
      2) We hired our best ops person from a coffee shop. Look at how people handle chaos, not titles.
      3) Your interview should feel like a day on the job. Give a real small task, pay for their time.
      4) Reply to every applicant. Even a no. Your reputation is built in the rejections.
      5) References are useless if you ask "were they good?" Ask "what would you not hand them?"
      6) Week one matters more than the offer letter. Have their laptop, their buddy and their first task ready.

