# Adversarial prompt-match cases (round-2 review). Every case below FAILED
# against the committed weights (prompts/similarity_weights.json, fit on the
# 319-prompt seed library) when it was written. It is a regression set for
# whoever fixes the matcher, never a fit set: it is not one of
# prompt_similarity_cases_{1..4}.yaml, so nothing fits on it.
#
# Score it (never omit --eval: without it similarity_fit refits and overwrites
# the weights):
#   cd backend && .venv/bin/python -m prompts.similarity_fit --eval \
#       --cases-glob 'prompt_similarity_adversarial.yaml'
#
# Same case shape as the other eval files. Kinds:
#   hard_negative  a DIFFERENT job on the same thing (opposite action, other
#                  output, other side of the conversation): expect none for
#                  that target. Failure seen: close or same.
#   extended       the library prompt with one requirement FLIPPED by a
#                  negation ("don't invent facts" -> "invent facts"): expect
#                  close. Failure seen: same (identical canonical hash).
#   paraphrase     the library prompt's job reworded, restructured or pasted
#                  with real content (filled: true): expect same. Failure seen:
#                  close, related or nothing at all.
# Each case's comment says what it got and why (the mechanism in similarity.py).
cases:

# ═══════════════════════════════════════════════════════════════════════
# 1. False "same" / "close": another job that shares most of the words.
#    The verifier has a +3.16 bias (an average pair verifies at ~0.96), the
#    role_conflict weight is ~0 and add/remove/longer/translate carry no role,
#    so one changed verb never lowers the level.
# ═══════════════════════════════════════════════════════════════════════

