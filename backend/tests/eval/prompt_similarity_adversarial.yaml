- id: adv-multi-paragraph-article-with-pointer
  target: Summarize an article
  kind: paraphrase
  expect: same
  filled: true
  query:
    body: |-
      Summarize this article for someone who doesn't have time to read it. Main point in one sentence, then 5 bullets with the key ideas in order of importance, keeping important numbers. Finish with "Worth knowing:" and the one detail most readers would miss. If it's one-sided or leaves something obvious out, say so in one line.

      Here's the article:

      A new city report finds that the protected bike lanes added downtown in 2023 cut car crashes on Elm Street by 18% in their first year. The lanes run for just over a mile between the train station and the river, and were the first of their kind in the city.

      Shop owners had warned the lanes would hurt sales by taking away parking spaces in front of their stores. But card spending on the street rose 6% over the same period, roughly in line with the rest of the city, according to figures from the three largest banks.

      The report did have gaps. It did not count injuries to cyclists, and it relied on police records that often miss minor accidents. Parking complaints to the city's hotline doubled, most of them from people who said they could no longer find a space near the pharmacy.

      Council members are split. Supporters say the numbers prove the lanes work and want to add them to three more streets next spring. Opponents want another year of data first, and some have asked for a survey of shop owners before any vote.

      The council votes on the plan next month. A public meeting will be held at the library on the 12th, and residents can also send written comments through the city's website until the end of the month.

