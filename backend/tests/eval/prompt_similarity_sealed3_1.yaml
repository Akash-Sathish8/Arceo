# Held-out prompt-match set, round 3, half 1 (sealed3_1).
# Corpus = every prompt in prompts/seed/*.yaml, sorted by title (case-insensitive).
# Half 1 = the first len(corpus)//2 titles. Targets are every 3rd title in that
# half starting at offset 1, with the kind rotating paraphrase -> extended ->
# trimmed -> hard_negative. Eight novel cases (target null) close the file.
# Written blind: without looking at the matcher, its lexicon, its weights or the
# other eval files. Queries are typed the way real people type: short, messy,
# out of order, with real content pasted in where a blank would be.
#
#   paraphrase    -> expect same   (same job, different words)
#   extended      -> expect close  (same job plus 1-2 genuinely new asks)
#   trimmed       -> expect close  (same job minus one important ask or output)
#   hard_negative -> expect none   for that target (same area, different job,
#                                  and no corpus prompt does this job)
#   novel         -> expect none   (no corpus prompt does this job)
cases:
# ── offset 1: A practice copy to try changes safely ─────────────────────────
- id: y1-practice-copy-para
  target: A practice copy to try changes safely
  kind: paraphrase
  expect: same
  query:
    title: test version of my site
    body: |
      im scared to touch my live site (its on netlify). can you make me a second copy of it thats private, where i can mess around and try stuff before real people see it? use fake info not my actual customers details, and make sure nothing i do in there sends real emails or charges anyone. explain how a change gets from the test one over to the real one, and how i undo it if it goes bad. show me the plan before setting anything up pls
# ── 4: Add a dark mode switch ───────────────────────────────────────────────
- id: y1-dark-mode-ext
  target: Add a dark mode switch
  kind: extended
  expect: close
  query:
