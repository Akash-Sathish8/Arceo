      can we get a dark mode on my plant care app? start with whatever their phone/computer is set to, put a little toggle up by the profile icon, and remember what they chose. dont just make it all black, keep it feeling like our green brand, and fix the logo + any pics with white backgrounds so they dont look weird on dark. leave the light version alone. ALSO add a third "high contrast" choice for people with bad eyesight (my dad keeps asking), and if theyre logged in save their choice to their account so it follows them to their other devices. list the colors u picked and tell me which screens to check in each mode
