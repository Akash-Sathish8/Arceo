- id: q2-helpful-checks-on-my-forms-ext
  target: Helpful checks on my forms
  kind: extended
  expect: close
  query:
    body: |-
      Improve the checks on {{which_form}}. Catch mistakes as people go, not only after they press the button: required fields, plus {{field_rules}}. Show each problem right under its field in kind, plain words (for example "Please add a phone number" rather than "Invalid"), and jump to the first problem when the button is pressed. Never clear what someone has already typed. Check the same rules again when the form arrives in the app, so nobody can skip them. Only change this form, and tell me how to try each rule.
      Also keep half-finished answers saved so a page refresh doesn't lose them, and add a character counter under the notes box.
- id: q2-hiring-scorecard-para
  target: Hiring scorecard
