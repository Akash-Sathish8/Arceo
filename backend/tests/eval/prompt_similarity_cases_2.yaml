  target: Help center article
  kind: extended
  expect: close
  query:
    body: |-
      Write a help center article for {{feature_name}}. Who it's for, steps with numbered headings, a troubleshooting section, and related links placeholders.
      End with a short FAQ of three questions, and also give me a one-paragraph version I can show inside the app next to that feature.
