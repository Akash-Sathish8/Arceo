- id: q2-overdue-invoice-reminder
  target: Invoice email extractor
  kind: hard_negative
  expect: none
  query:
    body: 'Write a polite reminder email to a client whose invoice {{invoice_number}} for {{amount}} is 15 days overdue. Friendly but clear: mention the original due date, how to pay, and offer to talk if there''s a problem. Under 120 words.'
    title: Overdue invoice reminder
- id: q2-is-my-app-safe-for-its-users-para
  target: Is my app safe for its users?
  kind: paraphrase
  expect: same
  query:
    body: 'I''m not technical. Can you check my app for security holes? Specifically: can one user see someone else''s account or data, are passwords and secret keys hidden from visitors, are pages that should need a login actually locked, and can forms be spammed? List what you find, most urgent first, what could happen because of each one, and how you''d fix it. Don''t change anything yet, and never print out a real key or password.'
- id: q2-is-my-app-safe-for-its-users-ext
  target: Is my app safe for its users?
  kind: extended
  expect: close
  query:
    body: |-
      Check my app for weak spots, explained for someone who doesn't code. Look at whether one person could see another person's account or data, whether passwords and secret keys are kept out of what visitors can see, whether pages that should need sign-in are open to anyone, and whether forms could be flooded with spam. List what you find with the most urgent first, what each could lead to, and the fix you'd suggest. Don't change anything yet, and never print an actual key or password.
      Also check that uploaded files can't be opened by guessing their links, and give me a one-page checklist I can rerun myself every month.
- id: q2-is-my-app-safe-for-its-users-trim
  target: Is my app safe for its users?
  kind: trimmed
  expect: close
  query:
    body: Check my app for weak spots, explained for someone who doesn't code. Look at whether one person could see another person's account or data, whether passwords and secret keys are kept out of what visitors can see, whether pages that should need sign-in are open to anyone, and whether forms could be flooded with spam. List what you find with the most urgent first. Don't change anything yet, and never print an actual key or password.
- id: q2-is-this-code-safe-to-add-para
  target: Is this code safe to add?
  kind: paraphrase
  expect: same
  query:
    body: |-
      A marketing agency told me to paste this into my site's header:

      <script>
      !function(w,d){w.trk=w.trk||[];var s=d.createElement('script');s.async=1;s.src='https://cdn.leadpixel-analytics.example/t.js?id=88213';d.head.appendChild(s)}(window,document);
      </script>

      What does it actually do? Does it send my visitors' info anywhere or load stuff from another site? Anything sketchy or pointless about it? Give me a straight answer on whether you'd add it, and don't put it in the project yet.
    title: Is this snippet OK?
- id: q2-embed-code-for-partners
  target: Is this code safe to add?
  kind: hard_negative
  expect: none
  query:
    body: Write code that other websites can paste into their pages to show my booking calendar, so partners can let people book with me from their own sites. Keep it to one short snippet, make it load quickly, and explain in plain words what each partner needs to do.
