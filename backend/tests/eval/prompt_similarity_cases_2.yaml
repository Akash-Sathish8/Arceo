- id: q2-invite-teammates-para
  target: Invite teammates
  kind: paraphrase
  expect: same
  query:
    body: Owners in my app should be able to invite people to their {{group}} by email. The invite link expires after {{days}}; clicking it lets them join (creating an account first if they need to) and drops them into the right {{group}}. The owner can see pending invites, cancel them, and choose each person's role from {{roles}}. Nobody should ever see a {{group}} they're not part of. Explain your plan in simple terms first, keep it focused, and tell me how to test it by inviting myself from a second account.
- id: q2-invite-teammates-ext
  target: Invite teammates
  kind: extended
  expect: close
  query:
    body: |-
      Let the owner of a {{team_word}} in my app invite teammates by email address. The invite contains a link that stops working after {{invite_lasts}}; opening it lets the person join (signing up first if needed) and lands them in the right {{team_word}}. The owner sees pending invites, can cancel one, and picks each person's level from {{levels}}. People can only ever see the {{team_word}} they belong to. Explain the plan in plain words first, keep the change focused, and tell me how to test it by inviting myself from a second account.
      Also email a reminder if an invite hasn't been accepted after three days, and let the owner hand ownership of the {{team_word}} to someone else.
    title: Invites with reminders
- id: q2-invoice-email-extractor-para
  target: Invoice email extractor
  kind: paraphrase
  expect: same
  query:
    body: |-
      Can you pull the details out of this invoice email into a table: who it's from, invoice number, amount, currency and due date? And flag anything that looks off.

      From: accounts@northline-packaging.example
      Subject: Invoice NP-3318
      Hi, please find attached invoice NP-3318 for 2,000 custom mailer boxes. Total due: EUR 3,860.00 by 15 December. Please note we've moved banks, so use the new account details on the attached invoice going forward.
      Thanks, Accounts Team

      Don't pay or send money anywhere, just get it ready for me to review.
