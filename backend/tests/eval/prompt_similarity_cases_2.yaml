- id: q2-how-my-updates-reach-the-internet-para
  target: How my updates reach the internet
  kind: paraphrase
  expect: same
  query:
    body: Explain to me, like I'm not technical at all, how a change I make here ends up on {{website}}. Where is the site hosted, what happens every time I publish an update, how would I roll back to an older version if an update breaks something, and which settings should I never mess with without help? Number the steps and use everyday comparisons. Just look and explain, don't change any settings or files.
    title: How does publishing work?
- id: q2-how-my-updates-reach-the-internet-ext
  target: How my updates reach the internet
  kind: extended
  expect: close
  query:
    body: |-
      In plain words, explain the journey a change takes from this project to {{my_domain}}, the address people type to reach my app. Walk me through where the app is hosted, what happens each time an update is published, how I'd go back to an earlier version after a bad update, and which settings I should never touch without help. Use a numbered list and everyday comparisons. Only look and explain; leave all settings and files as they are.
      Also tell me roughly what each part costs each month, and draw the whole journey as a simple diagram with boxes and arrows.
- id: q2-icon-for-browser-tabs-and-home-screens-para
  target: Icon for browser tabs and home screens
  kind: paraphrase
  expect: same
  query:
