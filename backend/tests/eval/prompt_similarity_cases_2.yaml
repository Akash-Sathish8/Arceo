    title: Better 404 page
- id: q2-maintenance-page
  target: Friendly page-not-found screen
  kind: hard_negative
  expect: none
  query:
    body: When I'm updating my site, I want visitors to see a friendly "We'll be right back" page in my site's style instead of errors. A short, kind message in a {{tone}} voice, our phone number for urgent bookings, and the time we expect to be back. Show me how to switch it on and off myself.
    title: Down for maintenance page
- id: q2-friendly-screens-for-when-there-s-nothin-para
  target: Friendly screens for when there's nothing yet
  kind: paraphrase
  expect: same
  query:
    body: 'In my {{kind_of_app}}, some screens look broken when there''s no data yet, for example {{which_screens}}. Make a nice empty state for each one: a simple illustration or icon, a short sentence explaining what will show up there, and a button for the obvious first step. Use one consistent style that matches the app. Only change what shows when the screen is empty, and tell me how to get to each one so I can check.'
- id: q2-friendly-screens-for-when-there-s-nothin-ext
  target: Friendly screens for when there's nothing yet
  kind: extended
  expect: close
  query:
    body: |-
      Some screens in my {{app_kind}} look bare or broken when there's nothing to show yet, such as {{empty_screens}}. Design a friendly empty screen for each: a simple picture or icon, one short line saying what will appear here, and a button for the obvious next step. Give them all the same style and match the rest of the app. Only change what appears when there's nothing to show. Tell me how to reach each empty screen so I can check it.
      On the habits list, also offer a one-tap sample habit people can add to see how it works, and count how many people tap each empty-screen button.
- id: q2-get-told-when-my-site-is-down-para
  target: Get told when my site is down
  kind: paraphrase
  expect: same
  query:
    body: I want to know right away if my website goes down. Recommend a free or cheap monitoring service that checks my site every few minutes and texts and emails me if it's not loading, and tell me exactly what to sign up for. It should check at least the homepage and the checkout page. If it helps, add a tiny "I'm alive" page to the site for it to check, but don't change anything else. Then give me a short, calm checklist of what to do first when an alert comes in.
    title: Uptime alerts
- id: q2-public-status-page
  target: Get told when my site is down
  kind: hard_negative
  expect: none
  query:
    body: Set up a public status page my customers can visit to see whether my booking site is working right now, with a short history of past outages and a place where I can post an update in plain words when something goes wrong. Pick a free or cheap service and tell me what to sign up for.
- id: q2-give-my-pages-room-to-breathe-para
  target: Give my pages room to breathe
  kind: paraphrase
  expect: same
  query:
    body: 'Everything on my site feels squished and uneven, especially {{where}}. Pick a few standard spacing sizes and apply them consistently: between sections, inside cards, around buttons, and between headings and the text below them. Make things line up on the same edges. Don''t touch any of the text, images or colors. Start with one page so I can compare, then do the others, and give me a quick list of what you changed at the end.'
- id: q2-give-my-pages-room-to-breathe-ext
  target: Give my pages room to breathe
  kind: extended
  expect: close
  query:
    body: |-
      My pages feel cramped and uneven, especially {{problem_areas}}. Settle on a small set of spacing sizes and use them everywhere: between sections, inside cards, around buttons, and between a heading and the text under it. Line things up along the same edges. Leave every word, picture and color as it is. Do one page first so I can see the difference, then the rest, and finish with a short list of what you adjusted.
      On phones, make the spacing a little tighter so nothing feels wasted, and make all section headings the same size while you're at it.
    title: Spacing pass plus heading sizes
- id: q2-give-my-pages-room-to-breathe-trim
  target: Give my pages room to breathe
  kind: trimmed
  expect: close
  query:
    body: 'My pages feel cramped and uneven, especially {{problem_areas}}. Settle on a small set of spacing sizes and use them everywhere: between sections, inside cards, around buttons, and between a heading and the text under it. Leave every word, picture and color as it is. Do one page first so I can see the difference, then the rest, and finish with a short list of what you adjusted.'
- id: q2-give-my-site-a-fresh-modern-look-para
  target: Give my site a fresh, modern look
  kind: paraphrase
  expect: same
  query:
    body: My website looks like it's from 2012. I want it to feel {{style}}. Look at all the pages first, then give me 2-3 possible design directions described in plain language (what would change with colors, fonts, spacing, rounded corners, shadows) and tell me which you'd go with. Let me pick. Then redo one page in that style so I can see it before you do the rest. Don't change any of my text, photos or links, only the look. At the end, list what changed and how I can compare before and after.
    title: Modernize my website
- id: q2-new-logo
  target: Give my site a fresh, modern look
  kind: hard_negative
  expect: none
  query:
    body: My logo feels dated. Describe two or three directions for a simpler, modern logo in plain words, wait for me to choose, then make that one in a version for light backgrounds and one for dark. Keep our name, {{business_name}}, spelled exactly as it is.
    title: New logo
- id: q2-giveaway-post-with-simple-rules-para
  target: Giveaway post with simple rules
  kind: paraphrase
  expect: same
  query:
    body: 'Help me run a giveaway on {{social_app}} for {{shop}}. We''re giving away {{what_they_win}}, and it closes {{deadline}}. Write a short, fun post with no more than three steps to enter. Below it, write simple, fair rules: who''s eligible, how and when we choose the winner, and how we''ll let them know. Remind me to check {{social_app}}''s contest rules and local laws before posting.'
- id: q2-giveaway-post-with-simple-rules-ext
  target: Giveaway post with simple rules
  kind: extended
  expect: close
  query:
    body: |-
      Write a giveaway post for {{platform}} from {{business_name}}. The prize is {{prize}} and entries close {{end_date}}. Keep the entry steps to three or fewer and the post itself short and fun. Underneath, write simple, fair rules: who can enter, how and when the winner is picked, and how they'll be told. Add a reminder for me to check {{platform}}'s own contest rules and any local laws before it goes live.
      Also write the post announcing the winner, and a short Story reminder for the last day of entries.
- id: q2-handover-notes-for-a-developer-para
  target: Handover notes for a developer
  kind: paraphrase
  expect: same
  query:
