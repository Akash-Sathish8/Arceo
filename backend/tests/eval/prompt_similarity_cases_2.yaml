- id: q2-form-won-t-submit-ext
  target: Form won't submit
  kind: extended
  expect: close
  query:
    body: |-
      When someone fills in the {{form_name}} form and presses the button, {{what_goes_wrong}}. The entries should end up in {{where_entries_belong}}. Find where it's breaking and fix it. Try it yourself with made-up details rather than anyone's real information, and confirm a test entry arrives. Keep the form's questions and design as they are, and tell me in plain words what was wrong.
      Also email me each time a new entry arrives, and show a short thank-you message on the page after someone sends the form.
- id: q2-form-won-t-submit-trim
  target: Form won't submit
  kind: trimmed
  expect: close
  query:
    body: When someone fills in the {{form_name}} form and presses the button, {{what_goes_wrong}}. The entries should end up in {{where_entries_belong}}. Find where it's breaking and fix it. Keep the form's questions and design as they are, and tell me in plain words what was wrong.
