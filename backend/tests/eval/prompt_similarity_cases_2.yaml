  kind: paraphrase
  expect: same
  query:
    body: Some images on my site are broken. On the {{page}} page I'm seeing {{what_appears}} instead of the photos. Figure out why (wrong file path, typo in the file name, or the image was never added) and fix it. Check with me before renaming or replacing any of my images. Let me know what the problem was and which images are working now.
- id: q2-images-not-showing-ext
  target: Images not showing
  kind: extended
  expect: close
  query:
    body: |-
      Some pictures on my site aren't showing. On the {{page_name}} page I see {{what_shows_instead}} where they should be. Work out why, for example a wrong file location, a misspelled name or a picture that never got added to the project, and fix it. Ask me before replacing or renaming any of my pictures. Tell me what was wrong and which ones now appear.
      While you're at it, shrink any very large pictures so the page loads faster, and add a short description to each picture for people using screen readers.
- id: q2-images-not-showing-trim
  target: Images not showing
  kind: trimmed
  expect: close
  query:
    body: Some pictures on my site aren't showing. On the {{page_name}} page I see {{what_shows_instead}} where they should be. Work out why, for example a wrong file location, a misspelled name or a picture that never got added to the project, and fix it. Tell me what was wrong and which ones now appear.
    title: Pictures missing on gallery
- id: q2-import-a-spreadsheet-into-my-app-para
  target: Import a spreadsheet into my app
  kind: paraphrase
  expect: same
  query:
