- id: q2-holiday-and-seasonal-promotion-ideas-trim
  target: Holiday and seasonal promotion ideas
  kind: trimmed
  expect: close
  query:
    body: Give me 8 promotion ideas for {{business_name}}, a {{business_type}}, for {{season_or_holiday}}. Skip plain discounts unless they come with a twist. For each idea, give a one-line pitch. Star the two you'd do first if you were me and say why.
