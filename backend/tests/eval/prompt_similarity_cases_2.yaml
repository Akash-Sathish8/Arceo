      Build a link-in-bio page for {{brand_name}}: my logo at the top, a one-line intro ("{{intro_line}}"), then big, easy-to-tap buttons for these links in this order: {{links}}. Put small icons for {{social_accounts}} at the bottom. Use my brand colors ({{brand_colors}}), make it load fast on a phone, and keep every link in one list I can edit easily. Build it as its own page without changing the rest of the site, and tell me how to open it on my phone when you're done.
