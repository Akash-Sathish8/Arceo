    title: Notes for the freelancer I'm hiring
- id: q2-developer-offboarding
  target: Handover notes for a developer
  kind: hard_negative
  expect: none
  query:
    body: 'My freelance developer finishes next week. Write me a plain-words checklist for ending the work safely: which accounts and outside services to remove them from, which passwords to change, what to ask them to hand back, and how to check nothing breaks after their access is gone. Don''t change any files.'
    title: When my developer finishes
- id: q2-help-center-article-para
  target: Help center article
  kind: paraphrase
  expect: same
