    title: SEO basics
- id: q2-hide-from-google
  target: Help people find my site on Google
  kind: hard_negative
  expect: none
  query:
    body: My site is still being built and I don't want it showing up on Google yet. Tell search engines not to list any of its pages for now, without adding a password, and remind me exactly what to undo on launch day so Google can find it.
- id: q2-helpful-checks-on-my-forms-para
  target: Helpful checks on my forms
  kind: paraphrase
  expect: same
  query:
