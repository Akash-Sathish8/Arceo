  target: Job post
  kind: paraphrase
  expect: same
  query:
    body: 'Draft a job listing for {{company}}, a {{stage}}-stage startup, hiring a {{position}}. Cover what the job involves day to day, what they''ll own after six months, who''ll love this job and who won''t, and include the pay range: {{pay}}.'
- id: q2-new-hire-announcement
  target: Job post
  kind: hard_negative
  expect: none
  query:
    body: Write a short LinkedIn post announcing that {{name}} has joined {{company_name}} as our founding engineer. Warm, a little personal, say what they'll be working on, and end by welcoming them. Under 120 words.
