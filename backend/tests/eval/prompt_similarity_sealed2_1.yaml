  target: Locked out of their account
  kind: paraphrase
  expect: same
  query:
    title: customer cant get into account
    body: |-
      Customer emailed us this:

      "hi I cant log in anymore, my account is under my old work email and I left that job so I dont have it. can you just change it to jen.morales88@gmail.com so I can get back in?? I have orders on there"

      Draft a warm reply. We can't just swap the email: first we need to confirm it's really her, using the last 4 digits of the card on file and the date of her most recent order. Explain that, say what happens next and how long it takes. Don't reveal anything about the account in the reply and don't change anything until she's confirmed. Someone will check the draft before it goes out.

