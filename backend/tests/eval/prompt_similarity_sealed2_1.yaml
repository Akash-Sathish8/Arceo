# --- [135] Is my app safe for its users? -----------------------------------
- id: z1-app-safety-extended
  target: Is my app safe for its users?
  kind: extended
  expect: close
  query:
    title: is my app secure
    body: |-
      Can you check my app for weak spots and explain it for someone who doesn't code? Things like: can one person see someone else's account or data, are passwords and secret keys hidden from visitors, are there pages that should need sign-in but don't, could the forms get flooded with spam. Most urgent first, what each could lead to, and the fix you'd suggest. Don't change anything yet and never print a real key or password. Also check whether any of the outside add-ons the app is built on are out of date and have known problems, and finish with a short paragraph I can forward to my business partner.

