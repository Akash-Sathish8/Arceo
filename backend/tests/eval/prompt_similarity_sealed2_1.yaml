# Held-out ("sealed") test set for the prompt-match algorithm, half 1 of 2.
#
# Written without looking at the matcher, its word lists, its weights or any
# earlier test set. Queries are typed the way real non-technical people type:
# typos, run-ons, very short asks, long rambling asks, British spellings,
# requirements in a different order, and real content pasted in instead of a
# blank to fill in.
#
# Corpus: every prompt in backend/prompts/seed/*.yaml, sorted by title
# (case-insensitive). This file covers the first half (integer math) and takes
# roughly every third prompt from it, rotating the case kind:
#   paraphrase    -> expect same   (same job, reworded)
#   extended      -> expect close  (same job plus 1-2 genuinely new requirements)
#   trimmed       -> expect close  (same job with one important requirement dropped)
#   hard_negative -> expect none   (same area and overlapping words, clearly a
#                                   different job; checked that no corpus prompt
#                                   does that job)
#   novel         -> expect none   (target null; checked that no corpus prompt
#                                   does that job)
cases:

# --- [0] A month of social post ideas --------------------------------------
- id: z1-month-social-posts
  target: A month of social post ideas
  kind: paraphrase
  expect: same
  query:
    title: insta posts for the month
    body: |-
      can u come up with a months worth of instagram posts for my bakery, we post like 3x a week. dont want it to be all "buy our stuff", maybe one salesy post out of every 4 tops, the rest can be behind the scenes, tips, customer stories, the odd fun one etc. put it in a table week by week w the day, the idea, first line of the caption and what pic or video to use. we have a sourdough class starting on the 14th and our 2nd birthday on the 28th so work those in

