[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arceo"
version = "0.2.0"
description = "Arceo SDK — capture LLM calls for cost forecasting and enforce agent policies at runtime."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "Arceo" }]
keywords = ["llm", "agents", "cost", "forecasting", "governance", "anthropic", "openai"]
dependencies = []   # stdlib only — sits alongside your anthropic/openai client

[project.urls]
Homepage = "https://github.com/Akash-Sathish8/Arceo"

[tool.setuptools]
packages = ["arceo"]
